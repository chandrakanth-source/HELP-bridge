[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = . tests
addopts = -v --tb=short
markers =
    unit: Unit tests for core functions and logic
    whitebox: White-box tests (branch/condition coverage)
    blackbox: Black-box tests (boundary value, equivalence class, decision tables)
    integration: Integration and REST API tests
    system: End-to-end system workflow tests
    validation: Requirements traceability tests (FR-01 to FR-14)
    automated: Automated test scripts (ATS-01 to ATS-10)
    nfr: Non-functional tests (performance, security, timer accuracy, reliability)
    selenium: UI automation tests using Selenium WebDriver
    real_api: Real backend REST API tests hitting deployed Render server
